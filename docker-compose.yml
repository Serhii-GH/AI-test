services:
  bot:
    build: .
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    command:
      - watchmedo
      - auto-restart
      - --directory=app
      - --pattern=*.py
      - --recursive
      - --debug-force-polling
      - --
      - python
      - -m
      - app.main
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    command:
      - uvicorn
      - app.api:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
    ports:
      - "8000:8000"
    restart: unless-stopped
