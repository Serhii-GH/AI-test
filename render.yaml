services:
  - type: web
    name: ai-saas-course
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: my_first_131313_bot
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: APP_ENV
        value: production
